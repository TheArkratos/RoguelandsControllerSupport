; Phase 1 candidate for the tested USB Xbox pad. Edit while the game is closed.
; This file is staged in the repo; the active config lives under GadgetCore/Configs/.
; Y toggles Combat Mode; L3 toggles the aim-assist evaluation.
; D-pad first direction activates once; return both axes to neutral to rearm.
[Bindings]
Move = LeftStick
AimTargetOrMenuSelection = RightStick
Jump = LeftTrigger
PrimaryAction = RightTrigger
Dash = Joystick1Button4
CombatMode = Joystick1Button3
Interact = Joystick1Button2
Inventory = Joystick1Button6
Pause = Joystick1Button7
MenuActivate = Joystick1Button0
MenuSecondary = Joystick1Button2
MenuTransfer = Joystick1Button3
MenuDrop = Joystick1Button5
MenuCancel = Joystick1Button1
AimAssist = Joystick1Button9
Hotkey1 = DPadUp
Hotkey2 = DPadRight
Hotkey3 = DPadDown
Hotkey4 = DPadLeft
Hotkey5 = Joystick1Button0
Hotkey6 = Joystick1Button1
